name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    name: Build Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup default stable
          rustup target add x86_64-unknown-linux-gnu
          rustc --version
          cargo --version

      - name: Build
        run: cargo build --release -p null-or-die --target x86_64-unknown-linux-gnu

      - name: Create archive
        shell: bash
        run: |
          archive_dir="null-or-die-linux-x86_64"
          mkdir -p "$archive_dir"
          cp target/x86_64-unknown-linux-gnu/release/null-or-die "$archive_dir/"
          cp README.md LICENSE "$archive_dir/"
          tar -czf null-or-die-linux-x86_64.tar.gz "$archive_dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: null-or-die-linux-x86_64
          path: null-or-die-linux-x86_64.tar.gz
          if-no-files-found: error

  build-windows:
    name: Build Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup default stable
          rustup target add x86_64-pc-windows-msvc
          rustc --version
          cargo --version

      - name: Build
        shell: pwsh
        run: cargo build --release -p null-or-die --target x86_64-pc-windows-msvc

      - name: Create archive
        shell: pwsh
        run: |
          $archiveDir = 'null-or-die-windows-x86_64'
          New-Item -ItemType Directory -Path $archiveDir -Force | Out-Null
          Copy-Item 'target/x86_64-pc-windows-msvc/release/null-or-die.exe' -Destination $archiveDir
          Copy-Item 'README.md','LICENSE' -Destination $archiveDir
          Compress-Archive -Path "$archiveDir/*" -DestinationPath 'null-or-die-windows-x86_64.zip' -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: null-or-die-windows-x86_64
          path: null-or-die-windows-x86_64.zip
          if-no-files-found: error

  build-macos:
    name: Build macOS Universal Binary
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        run: |
          rustup default stable
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          rustc --version
          cargo --version

      - name: Build x86_64
        run: cargo build --release -p null-or-die --target x86_64-apple-darwin

      - name: Build aarch64
        run: cargo build --release -p null-or-die --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          lipo -create \
            target/x86_64-apple-darwin/release/null-or-die \
            target/aarch64-apple-darwin/release/null-or-die \
            -output null-or-die

      - name: Create archive
        shell: bash
        run: |
          archive_dir="null-or-die-macos-universal"
          mkdir -p "$archive_dir"
          cp null-or-die "$archive_dir/null-or-die"
          cp README.md LICENSE "$archive_dir/"
          tar -czf null-or-die-macos-universal.tar.gz "$archive_dir"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: null-or-die-macos-universal
          path: null-or-die-macos-universal.tar.gz
          if-no-files-found: error

  publish-release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs:
      - build-linux
      - build-windows
      - build-macos
    steps:
      - uses: actions/checkout@v6

      - name: Set release tag
        shell: bash
        run: |
          short_hash=$(git rev-parse --short HEAD)
          echo "RELEASE_TAG=$short_hash" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: dist

      - name: Publish GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          tag="$RELEASE_TAG"
          release_title="Automated Release"

          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --target "$GITHUB_SHA" --title "$release_title" --notes ""

          gh release upload "$tag" \
            dist/null-or-die-linux-x86_64/null-or-die-linux-x86_64.tar.gz \
            dist/null-or-die-windows-x86_64/null-or-die-windows-x86_64.zip \
            dist/null-or-die-macos-universal/null-or-die-macos-universal.tar.gz \
            --clobber
